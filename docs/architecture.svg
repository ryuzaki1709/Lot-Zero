<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradClient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gradCompute" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gradBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00dc82" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="740" fill="#0b1120"/>

  <!-- Title Header -->
  <text x="40" y="42" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="-0.5">Lot Zero — System Architecture</text>
  <text x="40" y="65" fill="#94a3b8" font-size="13">Deterministic Recall Incident Workspace · Google Cloud Run · Ephemeral SQLite / Future Cloud SQL · Gemini 3.5 Flash</text>

  <!-- ==================== 1. CLIENT LAYER ==================== -->
  <rect x="40" y="85" width="310" height="615" rx="10" fill="url(#gradClient)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="85" width="310" height="38" rx="10" fill="#1e293b" />
  <rect x="40" y="113" width="310" height="10" fill="#1e293b" />
  <text x="56" y="110" fill="#38bdf8" font-size="13" font-weight="700">CLIENT LAYER: Browser SPA (React + Vite)</text>

  <!-- Client Box 1: Role Cockpit -->
  <rect x="56" y="135" width="278" height="98" rx="6" fill="url(#gradBox)" stroke="#475569" stroke-width="1"/>
  <text x="70" y="158" fill="#f1f5f9" font-size="13" font-weight="600">Role-Based Incident Cockpit</text>
  <text x="70" y="178" fill="#cbd5e1" font-size="11.5">• 5 Evaluation Personas (4 Ops + Admin)</text>
  <text x="70" y="196" fill="#cbd5e1" font-size="11.5">• Server-Enforced Separation of Duties</text>
  <text x="70" y="214" fill="#cbd5e1" font-size="11.5">• Persona-Gated Action Deserialization</text>

  <!-- Client Box 2: Dual Signature Rail -->
  <rect x="56" y="245" width="278" height="100" rx="6" fill="url(#gradBox)" stroke="#00dc82" stroke-width="1"/>
  <text x="70" y="268" fill="#00dc82" font-size="13" font-weight="600">Dual-Signature Release Rail</text>
  <text x="70" y="288" fill="#cbd5e1" font-size="11.5">Step 1: QA Lead Biological Clearance (Re-test Hash)</text>
  <text x="70" y="306" fill="#cbd5e1" font-size="11.5">Step 2: Closure Authority Operational Release</text>
  <text x="70" y="324" fill="#94a3b8" font-size="11">• Modeled § 7.49 Non-Response Escalation</text>

  <!-- Client Box 3: Real-Time Stream -->
  <rect x="56" y="358" width="278" height="92" rx="6" fill="url(#gradBox)" stroke="#475569" stroke-width="1"/>
  <text x="70" y="381" fill="#f1f5f9" font-size="13" font-weight="600">Real-Time Event Consumer</text>
  <text x="70" y="401" fill="#cbd5e1" font-size="11.5">• Server-Sent Events (SSE) stream subscriber</text>
  <text x="70" y="419" fill="#cbd5e1" font-size="11.5">• 60s Ephemeral HMAC Token Authentication</text>

  <!-- Client Box 4: Audit Inspector -->
  <rect x="56" y="462" width="278" height="105" rx="6" fill="url(#gradBox)" stroke="#c084fc" stroke-width="1"/>
  <text x="70" y="485" fill="#c084fc" font-size="13" font-weight="600">Audit Inspector &amp; Export</text>
  <text x="70" y="505" fill="#cbd5e1" font-size="11.5">• Download Self-Verifying JSON Bundle</text>
  <text x="70" y="523" fill="#cbd5e1" font-size="11.5">• SHA-256 Chained Predecessor Hashes</text>
  <text x="70" y="541" fill="#cbd5e1" font-size="11.5">• Verified Root Hash Integrity</text>

  <!-- Client Box 5: Case Dashboard -->
  <rect x="56" y="578" width="278" height="105" rx="6" fill="url(#gradBox)" stroke="#475569" stroke-width="1"/>
  <text x="70" y="601" fill="#f1f5f9" font-size="13" font-weight="600">Case Projection Views</text>
  <text x="70" y="621" fill="#cbd5e1" font-size="11.5">• Open Holds / Pending QA / Refusal tabs</text>
  <text x="70" y="639" fill="#cbd5e1" font-size="11.5">• Materialized Read Models from Event Log</text>
  <text x="70" y="657" fill="#94a3b8" font-size="11">• In-flight AbortController race protection</text>

  <!-- ==================== 2. COMPUTE LAYER (Cloud Run) ==================== -->
  <rect x="410" y="85" width="420" height="615" rx="10" fill="url(#gradCompute)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="410" y="85" width="420" height="38" rx="10" fill="#1e293b" />
  <rect x="410" y="113" width="420" height="10" fill="#1e293b" />
  <text x="430" y="110" fill="#38bdf8" font-size="13" font-weight="700">COMPUTE: Google Cloud Run Container (FastAPI + SPA)</text>

  <!-- Compute Box 1: API Router -->
  <rect x="430" y="135" width="380" height="85" rx="6" fill="url(#gradBox)" stroke="#475569" stroke-width="1"/>
  <text x="445" y="158" fill="#f1f5f9" font-size="13" font-weight="600">FastAPI Router &amp; SPA Static Server</text>
  <text x="445" y="178" fill="#cbd5e1" font-size="11.5">• Endpoints: /api/evaluation/*, /api/projections/*</text>
  <text x="445" y="196" fill="#cbd5e1" font-size="11.5">• Static mount: dist/client with index.html fallback</text>

  <!-- Compute Box 2: Authority Kernel -->
  <rect x="430" y="230" width="380" height="100" rx="6" fill="url(#gradBox)" stroke="#00dc82" stroke-width="1"/>
  <text x="445" y="253" fill="#00dc82" font-size="13" font-weight="600">Separation of Duties Authority Kernel</text>
  <text x="445" y="273" fill="#cbd5e1" font-size="11.5">• Principal &amp; Role extraction from X-API-Key</text>
  <text x="445" y="291" fill="#cbd5e1" font-size="11.5">• Anti-Self-Approval check (requester != approver)</text>
  <text x="445" y="309" fill="#94a3b8" font-size="11">• Dual-signature clearance sequence validation</text>

  <!-- Compute Box 3: Reducer & State Machine -->
  <rect x="430" y="340" width="380" height="95" rx="6" fill="url(#gradBox)" stroke="#475569" stroke-width="1"/>
  <text x="445" y="363" fill="#f1f5f9" font-size="13" font-weight="600">Deterministic Reducer Engine</text>
  <text x="445" y="383" fill="#cbd5e1" font-size="11.5">• Pure reducer functions over domain events</text>
  <text x="445" y="401" fill="#cbd5e1" font-size="11.5">• Optimistic concurrency check (expected_version)</text>
  <text x="445" y="419" fill="#cbd5e1" font-size="11.5">• In-memory current_state rehydrated on boot</text>

  <!-- Compute Box 4: Projections & Exporter -->
  <rect x="430" y="445" width="380" height="95" rx="6" fill="url(#gradBox)" stroke="#475569" stroke-width="1"/>
  <text x="445" y="468" fill="#f1f5f9" font-size="13" font-weight="600">Read Projections &amp; Audit Exporter</text>
  <text x="445" y="488" fill="#cbd5e1" font-size="11.5">• Query case summaries by filter from events table</text>
  <text x="445" y="506" fill="#cbd5e1" font-size="11.5">• Builds SHA-256 hash chained audit export bundle</text>
  <text x="445" y="524" fill="#cbd5e1" font-size="11.5">• Calculates deterministic root digest</text>

  <!-- Compute Box 5: SSE Hub -->
  <rect x="430" y="550" width="380" height="135" rx="6" fill="url(#gradBox)" stroke="#38bdf8" stroke-width="1"/>
  <text x="445" y="573" fill="#38bdf8" font-size="13" font-weight="600">Real-Time SSE Hub</text>
  <text x="445" y="593" fill="#cbd5e1" font-size="11.5">• Issues 60s ephemeral HMAC-SHA256 tokens</text>
  <text x="445" y="611" fill="#cbd5e1" font-size="11.5">• Broadcasts state delta to all active clients</text>
  <text x="445" y="629" fill="#cbd5e1" font-size="11.5">• Automatic reconnection &amp; heartbeat handling</text>
  <text x="445" y="647" fill="#94a3b8" font-size="11">• Scoped strictly by tenant_id</text>

  <!-- ==================== 3. EXTERNAL & CLOUD SERVICES ==================== -->
  <!-- AI: Gemini 3.5 Flash -->
  <rect x="890" y="85" width="270" height="150" rx="8" fill="url(#gradCompute)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="890" y="85" width="270" height="32" rx="8" fill="#1e293b" />
  <rect x="890" y="107" width="270" height="10" fill="#1e293b" />
  <text x="905" y="107" fill="#38bdf8" font-size="12" font-weight="700">AI: Gemini 3.5 Flash (Google GenAI)</text>
  <text x="905" y="138" fill="#f1f5f9" font-size="12" font-weight="600">Multimodal Signal Extraction</text>
  <text x="905" y="158" fill="#cbd5e1" font-size="11.5">• Ingests lab Salmonella notices</text>
  <text x="905" y="176" fill="#cbd5e1" font-size="11.5">• Extracts lot ING-4417 &amp; pathogen</text>
  <text x="905" y="194" fill="#cbd5e1" font-size="11.5">• Character-offset citation spans</text>
  <text x="905" y="212" fill="#94a3b8" font-size="11">• Bound to source report SHA-256</text>

  <!-- Storage: Container Local SQLite -->
  <rect x="890" y="250" width="270" height="155" rx="8" fill="url(#gradCompute)" stroke="#00dc82" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="890" y="250" width="270" height="32" rx="8" fill="#1e293b" />
  <rect x="890" y="272" width="270" height="10" fill="#1e293b" />
  <text x="905" y="272" fill="#00dc82" font-size="12" font-weight="700">STORAGE: Local SQLite Event Store</text>
  <text x="905" y="303" fill="#f1f5f9" font-size="12" font-weight="600">Append-Oriented Event Store</text>
  <text x="905" y="323" fill="#cbd5e1" font-size="11.5">• Path: /tmp/lot_zero.db</text>
  <text x="905" y="341" fill="#cbd5e1" font-size="11.5">• Table: incident_events</text>
  <text x="905" y="359" fill="#cbd5e1" font-size="11.5">• PRIMARY KEY(tenant_id, case_id, version)</text>
  <text x="905" y="377" fill="#94a3b8" font-size="11">• Single-instance (--max-instances=1)</text>

  <!-- Security: Container Environment Configuration -->
  <rect x="890" y="420" width="270" height="120" rx="8" fill="url(#gradCompute)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="890" y="420" width="270" height="32" rx="8" fill="#1e293b" />
  <rect x="890" y="442" width="270" height="10" fill="#1e293b" />
  <text x="905" y="442" fill="#cbd5e1" font-size="12" font-weight="700">CONFIG: Container Runtime Environment</text>
  <text x="905" y="473" fill="#f1f5f9" font-size="12" font-weight="600">Runtime Config &amp; Secret Injection</text>
  <text x="905" y="493" fill="#cbd5e1" font-size="11.5">• LOT_ZERO_SSE_SECRET</text>
  <text x="905" y="511" fill="#cbd5e1" font-size="11.5">• LOT_ZERO_API_KEYS / Vertex Config</text>
  <text x="905" y="527" fill="#94a3b8" font-size="10.5">• Secret Manager recommended for prod</text>

  <!-- Auditor Bundle -->
  <rect x="890" y="555" width="270" height="145" rx="8" fill="url(#gradCompute)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="890" y="555" width="270" height="32" rx="8" fill="#1e293b" />
  <rect x="890" y="577" width="270" height="10" fill="#1e293b" />
  <text x="905" y="577" fill="#c084fc" font-size="12" font-weight="700">AUDITOR: Regulatory Evidence Export</text>
  <text x="905" y="608" fill="#f1f5f9" font-size="12" font-weight="600">Tamper-Evident Evidence Stream</text>
  <text x="905" y="628" fill="#cbd5e1" font-size="11.5">• Modeled § 7.49 Non-Response Referral</text>
  <text x="905" y="646" fill="#cbd5e1" font-size="11.5">• SHA-256 Hash Chained Bundle</text>
  <text x="905" y="664" fill="#cbd5e1" font-size="11.5">• Deterministic Top-Level Digest</text>
  <text x="905" y="682" fill="#94a3b8" font-size="10.5">• Offline &amp; third-party verifiable</text>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- Client to Gateway -->
  <line x1="350" y1="175" x2="410" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- Gateway to AI -->
  <line x1="830" y1="165" x2="890" y2="165" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- Reducer to Storage -->
  <line x1="830" y1="380" x2="890" y2="330" stroke="#00dc82" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Exporter to Auditor -->
  <line x1="612" y1="630" x2="890" y2="630" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" />
</svg>
