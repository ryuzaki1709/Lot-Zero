name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12, Ruff, Mypy, Pytest)
    runs-on: ubuntu-latest
    env:
      LOT_ZERO_EVALUATION_MODE: "true"
      GOOGLE_GENAI_USE_VERTEXAI: "false"
      GEMINI_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies with constraints
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -c constraints-dev.txt -e "apps/api[dev]"

      - name: Run Ruff linter
        run: ruff check apps/api

      - name: Run Ruff formatter check
        run: ruff format --check apps/api

      - name: Run Mypy static type checker
        run: mypy --config-file apps/api/pyproject.toml apps/api/src

      - name: Run Pytest test suite (Deterministic Replay)
        run: pytest apps/api/tests -ra -p no:cacheprovider

      - name: Audit project Markdown links
        run: python scripts/audit_markdown_links.py

  frontend:
    name: Frontend (Node.js, Tests, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Verify production build
        run: npm run build
